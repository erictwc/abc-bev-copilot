# Additional eval cases E41-E50, using the same [[case]] schema as evals/cases.toml.
# Dataset anchor: 2026-10-31. Dates do not move with the day the eval is run.
# Coverage: sql 2, docs 2, combined 2, decline 2, trap 2.
# Each SQL source is one read-only query; comments identify additional document proof.

[[case]]
id = "E41"
author = "eric"
category = "sql"
question = "For POs shipped during September 2026, which three distributors had the most cases shipped short? Measure the shortfall as ordered quantity minus shipped quantity, use ship_date to select the month, and break any ties alphabetically by distributor. Give the shortfall in cases for each."
answer = "Quarrytown Distributing had the largest shortfall at 230 cases, followed by Ostrander Valley Distributing at 120 cases and Calderwick Distribution at 80 cases. These are case shortfalls on shipped or received POs with September 2026 ship dates, not counts of short POs."
numbers = [230, 120, 80]
expect = ["Quarrytown Distributing", "Ostrander Valley Distributing", "Calderwick Distribution"]
tools = ["run_sql"]
source = '''
SELECT distributor, SUM(qty - shipped_qty) AS short_cases
FROM distributor_orders
WHERE status IN ('shipped', 'received')
  AND ship_date >= DATE '2026-09-01'
  AND ship_date < DATE '2026-10-01'
GROUP BY distributor
ORDER BY short_cases DESC, distributor
LIMIT 3;
'''
notes = "Use actual ship dates and shipped quantities. Open or confirmed POs with unknown shipped_qty are not short shipments."

[[case]]
id = "E42"
author = "eric"
category = "sql"
question = "Compare QLB-GUA-C12 on-hand stock on October 19 and October 26, 2026. How many cases did it fall in each warehouse, and which warehouse had the largest decline?"
answer = "WH-EAST fell by 242 cases, from 2,201 to 1,959; WH-WEST fell by 158 cases, from 890 to 732; WH-CENTRAL fell by 11 cases, from 891 to 880. WH-EAST had the largest decline. These changes compare two snapshots of on-hand stock and do not establish the cause of the decline."
numbers = [242, 158, 11]
expect = ["WH-EAST", "WH-WEST", "WH-CENTRAL"]
tools = ["run_sql"]
source = '''
SELECT warehouse,
       MAX(on_hand) FILTER (WHERE snapshot_date = DATE '2026-10-19') AS previous_on_hand,
       MAX(on_hand) FILTER (WHERE snapshot_date = DATE '2026-10-26') AS latest_on_hand,
       MAX(on_hand) FILTER (WHERE snapshot_date = DATE '2026-10-19')
         - MAX(on_hand) FILTER (WHERE snapshot_date = DATE '2026-10-26') AS decline_cases
FROM warehouse_inventory
WHERE sku_id = 'QLB-GUA-C12'
  AND snapshot_date IN (DATE '2026-10-19', DATE '2026-10-26')
GROUP BY warehouse
ORDER BY decline_cases DESC, warehouse;
'''
notes = "Compare warehouse-matched snapshots. Do not sum successive inventory balances or call the decline sales or depletions. Positive decline_cases means stock fell."

