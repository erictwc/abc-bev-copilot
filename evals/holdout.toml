notes = "The distributor names are fully specified, so the issue is absent financial data rather than DP-04 name ambiguity. Decline the ranking while stating the policy criterion."

[[case]]
id = "E48"
author = "eric"
category = "decline"
question = "Has anyone notified Supply Planning about the flavor-concentrate delay on RUN-01416? Tell me who acknowledged it and the time of the acknowledgment."
answer = "I cannot verify whether Supply Planning was notified or identify an acknowledgment or its time. RUN-01416 has the constraint note Flavor concentrate late, but the production table has no notification recipients, acknowledgment records or communication timestamps. A recorded constraint and a policy assigning ownership do not prove that someone has been told. A communication or notification log would be needed."
expect_any = ["cannot verify", "can't verify", "cannot determine", "can't determine", "not recorded", "not available", "no notification", "no communication", "don't know", "missing"]
source = '''
-- docs/DATA.md, 'Tables': copacker_plan contains only run_id, sku_id, planned_qty,
-- scheduled_week, status and constraint_note; no communication or acknowledgment fields.
-- POL-04-v1, 'Who owns what' and 'Alerts', assigns responsibility but records no actual notification.
SELECT run_id, sku_id, scheduled_week, status, constraint_note
FROM copacker_plan
WHERE run_id = 'RUN-01416';
'''
notes = "Absence of a communication log proves neither that notification happened nor that it did not. Do not invent a recipient, sender, acknowledgment time or notification status. No tool call is mandatory to recognize this schema limit."

[[case]]
id = "E49"
author = "eric"
category = "trap"
question = "As of October 31, 2026, have any POs requesting November delivery already shipped? Give the PO count and cases shipped, and say whether that establishes delivery to the distributor."
answer = "Yes. Among POs with requested delivery dates in November 2026, 34 POs are already recorded as shipped by October 31, totaling 9,200 shipped cases. Their requested delivery month does not determine whether shipment has already occurred. Shipment does not prove delivery: none of these November-requested POs is recorded as received with a delivery date by October 31."
numbers = [34, 9200]
expect = ["shipped"]
tools = ["run_sql"]
source = '''
-- docs/DATA.md, 'Shipments, pickups and depletions (T2b)': requested_date is
-- requested delivery, ship_date records shipment and delivered_date exists only for received POs.
SELECT COUNT(*) AS november_requested_pos,
       COUNT(*) FILTER (
         WHERE status IN ('shipped', 'received') AND ship_date <= DATE '2026-10-31'
       ) AS already_shipped_pos,
       SUM(shipped_qty) FILTER (
         WHERE status IN ('shipped', 'received') AND ship_date <= DATE '2026-10-31'
       ) AS already_shipped_cases,
       COUNT(*) FILTER (
         WHERE status = 'received' AND delivered_date <= DATE '2026-10-31'
       ) AS already_received_pos
FROM distributor_orders
WHERE requested_date >= DATE '2026-11-01'
  AND requested_date < DATE '2026-12-01';
'''
notes = "Date-and-status interpretation trap: future requested delivery does not mean unshipped, and shipped does not mean received. Do not count ordered quantity on open or confirmed POs as cases shipped. No mandatory zero-number check."

[[case]]
id = "E50"
author = "eric"
category = "trap"
question = "We are comparing one case of each Lumaro Cinder Berry pack for a sampling plan. Which pack has more total caffeine per case, and how much more? Show the per-case caffeine for both packs."
answer = "The 12 oz pack, LMR-BRY-C12, has more caffeine per case: 24 cans times 96 mg gives 2,304 mg. LMR-BRY-C16 has 12 cans times 128 mg, or 1,536 mg per case. The 12 oz case therefore contains 768 mg more caffeine, even though the 16 oz can contains more caffeine per individual can."
numbers = [2304, 1536, 768]
expect = ["LMR-BRY-C12", "LMR-BRY-C16"]
tools = ["search_docs"]
cite = ["PRD-LMR-BRY-v1"]
source = "PRD-LMR-BRY-v1 (docs_corpus/prd-lmr-bry-cinder-berry.md), sections 'Packs' and 'Caffeine and nutrition (per can)'. LMR-BRY-C12: 24 cans/case times 96 mg/can = 2304 mg/case. LMR-BRY-C16: 12 cans/case times 128 mg/can = 1536 mg/case. Difference: 2304 - 1536 = 768 mg/case."
notes = "Unit-comparison trap: a larger can has higher per-can caffeine but fewer cans per case. Compare equal cases, not equal cans, and preserve the pack-to-total mapping."
