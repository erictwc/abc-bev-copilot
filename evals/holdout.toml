notes = "Unchanged dates do not preserve authorization after a SKU change. Do not invent an exception for small edits or grant the submitter approval authority."

[[case]]
id = "E45"
author = "eric"
category = "combined"
question = "Fenwhistle Distributing reports damage on PO-004391 today, October 31, 2026. Assume the damage is confirmed to have occurred during shipping. Using the recorded receipt date, is the report within our return window, what is the reporting deadline, and who approves the credit?"
answer = "PO-004391 was received on October 22, 2026. The October 31 report is 9 days after receipt, within the 14 days allowed for reporting shipping damage. The reporting deadline is November 5, 2026. Shipping damage qualifies for a credit, and the Commercial VP must approve the return. Damage during shipping is stipulated in the question; the PO table does not itself prove that damage occurred."
numbers = [9, 14]
expect = ["PO-004391", "Commercial VP", "credit"]
tools = ["run_sql", "search_docs"]
cite = ["POL-05-v1"]
source = '''
-- POL-05-v1 (docs_corpus/pol-05-returns.md), 'When returns are accepted':
-- shipping damage qualifies for credit, with Commercial VP approval and reporting within 14 days.
-- The question supplies the damage circumstances and reporting date.
SELECT po_id, distributor, status, delivered_date,
       DATE '2026-10-31' - delivered_date AS days_since_receipt,
       CAST(delivered_date + INTERVAL 14 DAY AS DATE) AS reporting_deadline
FROM distributor_orders
WHERE po_id = 'PO-004391';
'''
notes = "Use delivered_date, not requested_date, ship_date or last_changed, to start the reporting window. The report is safely inside the boundary; damage evidence is an explicit question assumption."

[[case]]
id = "E46"
author = "eric"
category = "combined"
question = "For an allocation comparison, treat QLB-TNG-C16 and LMR-BRY-C12 as regular SKUs with no promo priority applying to either. Which ranks first under our popularity rule? Use the six months from May 1 through October 31, 2026, and give the depletion cases for each."
answer = "QLB-TNG-C16 ranks first, with 22,903 depletion cases, ahead of LMR-BRY-C12 with 18,313 cases. Regular SKUs rank by rolling six-month depletions under POL-02. MET-01 defines depletions as all product moved out, so these totals include sold, samples, spoiled and damaged cases. The comparison is between SKUs; distributor net-profitability priority is a separate rule."
numbers = [22903, 18313]
expect = ["QLB-TNG-C16", "LMR-BRY-C12"]
tools = ["run_sql", "search_docs"]
cite = ["POL-02-v1", "MET-01-v1"]
source = '''
-- POL-02-v1 (docs_corpus/pol-02-allocation.md), 'Priority between SKUs':
-- regular SKUs rank by rolling six-month depletions after qualifying promoted SKUs.
-- MET-01-v1 (docs_corpus/met-01-metric-library.md), 'Depletions': include all reasons.
-- The question explicitly removes promo priority from this comparison.
SELECT s.sku_id, s.status,
       SUM(d.sold) AS sold_cases, SUM(d.samples) AS sample_cases,
       SUM(d.spoiled) AS spoiled_cases, SUM(d.damaged) AS damaged_cases,
       SUM(d.sold + d.samples + d.spoiled + d.damaged) AS depletion_cases
FROM distributor_depletions d
JOIN sku_master s ON d.sku_id = s.sku_id
WHERE d.sku_id IN ('QLB-TNG-C16', 'LMR-BRY-C12')
  AND d.week_ending >= DATE '2026-05-01'
  AND d.week_ending < DATE '2026-11-01'
GROUP BY s.sku_id, s.status
ORDER BY depletion_cases DESC, s.sku_id;
'''
notes = "Use distributor depletion reports rather than purchase-order quantities, and include non-sale movements. The period and priority assumptions are explicit."

