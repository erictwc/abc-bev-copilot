[[case]]
id = "E44"
author = "eric"
category = "docs"
question = "A retailer wants to swap the SKU on an already authorized promo while keeping the dates unchanged. Can the Marketing Manager just approve that edit? Who must authorize the change, and what supporting information does the promo authorization procedure require for a submission?"
answer = "The SKU change must be authorized again even though the dates are unchanged. The Commercial VP authorizes every promo; the Marketing Manager can submit the change but cannot replace that authorization. A submission needs a planned lift, a stock and cover check, a budget and the ROI of previous programs with the same retailer or chain."
