[[case]]
id = "E09"
author = "eric"
category = "combined"
question = "As of October 31, 2026, what is supply available for TRV-YUZ-C16 under our metric definition? Use the latest warehouse snapshot across all three warehouses and the current POs awaiting pickup. Show the inputs and explain how in-transit cases are treated."
answer = "The latest warehouse snapshot is October 26, 2026. Across the three warehouses, TRV-YUZ-C16 has 1,081 cases on hand and 408 allocated. Confirmed POs with assigned pickup dates account for another 150 cases awaiting pickup. Supply available is 1,081 minus 408 minus 150, or 523 cases. The 184 cases in transit do not count as available. Allocated stock and POs awaiting pickup are separate deductions."
numbers = [1081, 408, 150, 523, 184]
tools = ["run_sql", "search_docs"]
cite = ["MET-01-v1"]
source = '''
-- MET-01-v1 (docs_corpus/met-01-metric-library.md), section 'Cover':
-- supply available = on-hand - allocated - issued POs awaiting pickup; exclude in transit.
-- docs/DATA.md, 'Shipments, pickups and depletions (T2b)':
-- awaiting pickup means status='confirmed' with a pickup_date; aggregate warehouses per SKU.
WITH stock AS (
  SELECT MAX(snapshot_date) AS snapshot_date,
         SUM(on_hand) AS on_hand_cases, SUM(allocated) AS allocated_cases,
         SUM(in_transit) AS in_transit_cases
  FROM warehouse_inventory
  WHERE sku_id = 'TRV-YUZ-C16'
    AND snapshot_date = (SELECT MAX(snapshot_date) FROM warehouse_inventory)
), pickups AS (
  SELECT COALESCE(SUM(qty), 0) AS awaiting_pickup_cases
  FROM distributor_orders
  WHERE sku_id = 'TRV-YUZ-C16'
    AND status = 'confirmed' AND pickup_date IS NOT NULL
)
SELECT snapshot_date, on_hand_cases, allocated_cases, awaiting_pickup_cases,
       in_transit_cases,
       on_hand_cases - allocated_cases - awaiting_pickup_cases AS supply_available_cases
FROM stock CROSS JOIN pickups;
'''

