[[case]]
id = "E31"
author = "claude"
category = "combined"
question = "Using our fill-rate definition, what was Quarrytown Distributing's fill rate for the 90 days ending October 31, 2026? Use its shipped and received POs with a ship date from August 3 to October 31, 2026, and show the cases behind the rate."
answer = "Fill rate is cases shipped divided by cases ordered over a rolling 90 days. On Quarrytown Distributing's shipped and received POs with ship dates from August 3 to October 31, 2026, 18,740 cases shipped against 19,010 ordered, a fill rate of 98.6%."
numbers = [18740, 19010, 98.6]
tools = ["run_sql", "search_docs"]
cite = ["MET-01-v1"]
source = '''
-- MET-01-v1 (docs_corpus/met-01-metric-library.md), section 'Fill rate':
-- cases shipped / cases ordered, over a rolling 90 days.
SELECT SUM(shipped_qty) AS shipped_cases, SUM(qty) AS ordered_cases,
       ROUND(100.0 * SUM(shipped_qty) / SUM(qty), 1) AS fill_rate_pct
FROM distributor_orders
WHERE distributor = 'Quarrytown Distributing'
  AND status IN ('shipped', 'received')
  AND ship_date >= DATE '2026-08-03' AND ship_date <= DATE '2026-10-31';
'''
notes = "The question supplies the cohort, as E04 does, because MET-01 does not say which date places a PO in the 90 days. Open and confirmed POs have no shipped_qty and are left out."

