[[case]]
id = "E04"
author = "eric"
category = "sql"
question = "Among POs received in October 2026, using delivered_date to choose the month, how many were delivered by their requested date with the full ordered quantity? Give the qualifying count, the total received count and the percentage to one decimal place, with no grace period or quantity tolerance."
answer = "Of 115 received POs delivered in October 2026, 105 were delivered by the requested date with the full ordered quantity. That is 91.3%. The other 10 failed at least one of those conditions."
numbers = [105, 115, 91.3]
tools = ["run_sql"]
source = '''
SELECT COUNT(*) FILTER (
         WHERE delivered_date <= requested_date AND shipped_qty = qty
       ) AS qualifying_pos,
       COUNT(*) AS received_pos,
       ROUND(100.0 * COUNT(*) FILTER (
         WHERE delivered_date <= requested_date AND shipped_qty = qty
       ) / COUNT(*), 1) AS qualifying_pct
FROM distributor_orders
WHERE status = 'received'
  AND delivered_date >= DATE '2026-10-01'
  AND delivered_date < DATE '2026-11-01';
'''
notes = "The question supplies the calculation, so this is SQL-only. Do not select the cohort by order_date or requested_date."

