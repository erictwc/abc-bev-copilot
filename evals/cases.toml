[[case]]
id = "E16"
author = "eric"
category = "trap"
question = "Does Torvane Frost Kiwi in the 12 oz can have an authorized promotion starting in November 2026? If so, give the banner and dates."
answer = "Yes. Stonefinch Fuel Stop has an authorized promotion from November 30 to December 13, 2026. The promo row spells the SKU TRV-KIWI-C12, while the master lists Frost Kiwi 12 oz as TRV-KIW-C12. This is an unmatched SKU spelling that needs reconciliation; an exact SKU join would wrongly drop the promotion. Report both IDs and flag the discrepancy without silently editing the data."
expect = ["Stonefinch Fuel Stop", "TRV-KIWI-C12", "TRV-KIW-C12"]
tools = ["run_sql"]
source = '''
-- docs/DATA.md, planted problem DP-01; the SQL preserves both raw and master IDs.
SELECT p.sku_id AS promo_sku_id, exact.sku_id AS exact_master_match,
       candidate.sku_id AS candidate_master_sku_id,
       candidate.brand, candidate.flavor, candidate.pack,
       p.chain, p.start_date, p.end_date, p.authorized
FROM promo_calendar p
LEFT JOIN sku_master exact ON p.sku_id = exact.sku_id
JOIN sku_master candidate
  ON candidate.sku_id = REPLACE(p.sku_id, 'TRV-KIWI-', 'TRV-KIW-')
WHERE candidate.brand = 'Torvane' AND candidate.flavor = 'Frost Kiwi'
  AND candidate.pack = '12 oz can' AND p.authorized = 'y'
  AND p.start_date >= DATE '2026-11-01' AND p.start_date < DATE '2026-12-01'
ORDER BY p.start_date, p.chain;
'''
notes = "DP-01. The replacement in this proving query only exposes a reconciliation candidate; it does not mutate the source. The expected answer must acknowledge the stored-ID mismatch."

[[case]]
id = "E17"
author = "eric"
category = "trap"
question = "Was June 2025 really a zero-demand month? Count POs by order_date for May, June and July, and check whether distributors still reported June depletions before interpreting the apparent drop."
answer = "The order table contains 205 POs in May 2025, no POs in June and 194 in July. June is a missing month of order data, not evidence of zero demand. Distributors still reported 812 depletion rows in June, totaling 51,008 cases across sold, samples, spoiled and damaged. Do not interpret the absent June order records as a real collapse in demand or a reliable 100% sales decline."
numbers = [205, 194, 812, 51008]
expect_any = ["missing", "gap", "incomplete"]
tools = ["run_sql"]
source = '''
-- docs/DATA.md, planted problem DP-02.
WITH months(month_start) AS (
  VALUES (DATE '2025-05-01'), (DATE '2025-06-01'), (DATE '2025-07-01')
), orders AS (
  SELECT DATE_TRUNC('month', order_date) AS month_start, COUNT(*) AS po_count
  FROM distributor_orders
  WHERE order_date >= DATE '2025-05-01' AND order_date < DATE '2025-08-01'
  GROUP BY 1
), depletions AS (
  SELECT DATE_TRUNC('month', week_ending) AS month_start,
         COUNT(*) AS report_rows,
         SUM(sold + samples + spoiled + damaged) AS depleted_cases
  FROM distributor_depletions
  WHERE week_ending >= DATE '2025-05-01' AND week_ending < DATE '2025-08-01'
  GROUP BY 1
)
SELECT STRFTIME(m.month_start, '%Y-%m') AS month,
       COALESCE(o.po_count, 0) AS recorded_pos,
       d.report_rows, d.depleted_cases
FROM months m
LEFT JOIN orders o USING (month_start)
LEFT JOIN depletions d USING (month_start)
ORDER BY m.month_start;
'''
notes = "DP-02. Zero is the observed row count, not a business demand measurement. Include all depletion reasons and do not switch to requested_date to hide the gap."

[[case]]
id = "E18"
author = "eric"
category = "trap"
question = "Can I tell Brindlecross Beverage that the 310 cases of Gale Passionfruit 16 oz on PO-004395 definitely shipped? Check the PO against production and inventory, and say who settles it if the source records disagree."
answer = "PO-004395 for Brindlecross Beverage is recorded as shipped for 310 cases of SKX-PSF-C16, with ship date October 14, 2026. However, its only production run, RUN-01349 for the week of October 5, was cancelled for Line maintenance, there are zero completed runs for the SKU and every inventory snapshot has zero on-hand stock. There are also no depletion rows for the SKU. Those records conflict, so the shipment record alone does not justify saying the physical shipment definitely happened; the true position must be verified. The owners of the conflicting sources investigate, and Finance decides which source is right. There is no direct PO-to-run key, so the comparison is by SKU and timing."
numbers = [310]
expect = ["PO-004395", "SKX-PSF-C16", "RUN-01349", "Finance", "cancelled"]
tools = ["run_sql", "search_docs"]
cite = ["POL-04-v1"]
source = '''
-- docs/DATA.md, planted problem DP-03.
-- POL-04-v1 (docs_corpus/pol-04-escalation-ownership.md),
-- 'Who owns what', row 'Two sources of data disagree'.
SELECT o.po_id, o.distributor, o.sku_id, o.qty, o.status AS po_status,
       o.ship_date, o.shipped_qty, o.delivered_date,
       r.run_id, r.scheduled_week, r.status AS run_status, r.constraint_note,
       (SELECT COUNT(*) FROM copacker_plan c
        WHERE c.sku_id = o.sku_id AND c.status = 'completed') AS completed_runs,
       (SELECT MIN(on_hand) FROM warehouse_inventory w
        WHERE w.sku_id = o.sku_id) AS minimum_recorded_on_hand,
       (SELECT MAX(on_hand) FROM warehouse_inventory w
        WHERE w.sku_id = o.sku_id) AS maximum_recorded_on_hand,
       (SELECT COUNT(*) FROM distributor_depletions d
        WHERE d.sku_id = o.sku_id) AS depletion_rows
FROM distributor_orders o
JOIN copacker_plan r ON o.sku_id = r.sku_id
WHERE o.po_id = 'PO-004395';
'''
notes = "DP-03. Do not erase the recorded shipment or assert the opposite physical outcome as fact. Flag conflicting evidence and verify it with the source owners."

[[case]]
