[[case]]
id = "E34"
author = "claude"
category = "combined"
question = "RUN-01416 for SKX-LYC-C16 carries a constraint note. If that run is cut, does the SKU go on allocation? Who starts the allocation and who is the final arbitrator, and does SKX-LYC-C16 rank as a promoted, regular or launch SKU?"
answer = "RUN-01416 is confirmed for 1,400 cases in the week of November 9, 2026, with the note Flavor concentrate late; the record does not show it has been cut. If it is cut, SKX-LYC-C16 goes on allocation, because a cut co-packer run is a trigger. The Production Manager starts the allocation, the Portfolio Manager takes it next, Sales Operations can weigh in and the Commercial VP is the final arbitrator. SKX-LYC-C16 is an active SKU with no promo running or starting within four weeks, so it ranks as a regular SKU, by rolling six-month depletions."
numbers = [1400]
expect = ["RUN-01416", "Flavor concentrate late", "Production Manager", "Commercial VP", "regular"]
tools = ["run_sql", "search_docs"]
cite = ["POL-02-v1"]
source = '''
-- POL-02-v1 (docs_corpus/pol-02-allocation.md), sections 'When a SKU goes on allocation',
-- 'Who decides' and 'Priority between SKUs'.
SELECT r.run_id, r.sku_id, r.scheduled_week, r.planned_qty, r.status AS run_status,
       r.constraint_note, s.status AS sku_status,
       (SELECT COUNT(*) FROM promo_calendar p
        WHERE p.sku_id = r.sku_id
          AND p.end_date >= r.scheduled_week
          AND p.start_date <= r.scheduled_week + INTERVAL 28 DAY) AS promos_running_or_within_4_weeks
FROM copacker_plan r
JOIN sku_master s ON s.sku_id = r.sku_id
WHERE r.run_id = 'RUN-01416';
'''
notes = "Hypothetical cut; do not report the run as cut. The SKU's latest promo ended 2026-09-27. Four weeks counted from the run week."

